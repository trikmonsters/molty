name: 🎬 YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL (video / shorts / playlist)'
        required: true
        type: string
      format:
        description: 'Format unduhan'
        required: true
        default: 'video-best'
        type: choice
        options:
          - video-best
          - video-1080p
          - video-720p
          - video-480p
          - audio-mp3-320
          - audio-mp3-192
          - audio-m4a
      subtitle:
        description: 'Subtitle (id / en / kosong = tidak)'
        required: false
        default: ''
        type: string

jobs:
  download:
    name: 📥 Download
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip -qq
          pip install -q --upgrade yt-dlp
          echo "✅ yt-dlp: $(yt-dlp --version)"
          echo "✅ ffmpeg: $(ffmpeg -version | head -1)"

      - name: 📁 Buat folder output
        run: mkdir -p ~/downloads

      # ─── COOKIES dari GitHub Secret (format Netscape) ─────
      - name: 🍪 Setup cookies dari Secret
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_SECURE_COOKIES" ]; then
            echo "$YT_SECURE_COOKIES" > ~/cookies.txt
            echo "✅ Cookies dimuat ($(wc -l < ~/cookies.txt) baris)"
          else
            echo "⚠️  Secret YT_SECURE_COOKIES tidak ditemukan — download mungkin gagal"
          fi

      # ─── DOWNLOAD ─────────────────────────────────────────
      - name: 🎬 Download
        run: |
          URL="${{ inputs.url }}"
          FORMAT="${{ inputs.format }}"
          SUBTITLE="${{ inputs.subtitle }}"

          ARGS=(
            --no-warnings
            --progress
            --retries 15
            --fragment-retries 15
            --retry-sleep linear=1::2
            --concurrent-fragments 4
            --no-part
            --merge-output-format mp4
            -o "$HOME/downloads/%(title)s [%(id)s].%(ext)s"
            --restrict-filenames
            --no-check-certificates
            --extractor-args "youtube:player_client=tv_embedded,web_creator,ios"
          )

          # Pakai cookies jika ada
          if [ -f ~/cookies.txt ]; then
            ARGS+=(--cookies ~/cookies.txt)
            echo "🍪 Menggunakan cookies"
          fi

          # Subtitle
          if [ -n "$SUBTITLE" ]; then
            ARGS+=(--write-subs --write-auto-subs --sub-langs "$SUBTITLE" --embed-subs)
          fi

          # Format
          case "$FORMAT" in
            video-best)    ARGS+=(-f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best") ;;
            video-1080p)   ARGS+=(-f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]") ;;
            video-720p)    ARGS+=(-f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]") ;;
            video-480p)    ARGS+=(-f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]") ;;
            audio-mp3-320) ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 0) ;;
            audio-mp3-192) ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 5) ;;
            audio-m4a)     ARGS+=(-f "bestaudio[ext=m4a]/bestaudio/best" -x --audio-format m4a) ;;
          esac

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 URL    : $URL"
          echo "📦 Format : $FORMAT"
          echo "🌐 Sub    : ${SUBTITLE:-tidak}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          yt-dlp "${ARGS[@]}" "$URL"

      # ─── FALLBACK ─────────────────────────────────────────
      - name: 🔄 Fallback — coba client lain
        if: failure()
        run: |
          URL="${{ inputs.url }}"
          FORMAT="${{ inputs.format }}"

          ARGS=(
            --no-warnings
            --retries 10
            --no-part
            --merge-output-format mp4
            -o "$HOME/downloads/%(title)s [%(id)s].%(ext)s"
            --restrict-filenames
            --no-check-certificates
            --extractor-args "youtube:player_client=mweb,ios,tv_embedded"
          )

          if [ -f ~/cookies.txt ]; then
            ARGS+=(--cookies ~/cookies.txt)
          fi

          case "$FORMAT" in
            video-best)    ARGS+=(-f "bestvideo+bestaudio/best") ;;
            video-1080p)   ARGS+=(-f "best[height<=1080]") ;;
            video-720p)    ARGS+=(-f "best[height<=720]") ;;
            video-480p)    ARGS+=(-f "best[height<=480]") ;;
            audio-*)       ARGS+=(-f "bestaudio/best" -x --audio-format mp3) ;;
          esac

          echo "⚠️ Mencoba fallback..."
          yt-dlp "${ARGS[@]}" "$URL"

      # ─── HASIL ────────────────────────────────────────────
      - name: 📊 Info hasil
        if: always()
        run: |
          if ls ~/downloads/* 2>/dev/null; then
            echo "✅ File berhasil diunduh:"
            ls -lh ~/downloads/
          else
            echo "❌ Tidak ada file yang diunduh"
          fi

      - name: ☁️ Upload ke GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dl-${{ github.run_number }}"
          name: "📥 Download #${{ github.run_number }}"
          body: |
            **URL:** ${{ inputs.url }}
            **Format:** ${{ inputs.format }}
            > File tersedia selama **90 hari**
          files: ~/downloads/*
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 📤 Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "yt-dl-${{ github.run_number }}"
          path: ~/downloads/
          retention-days: 90
