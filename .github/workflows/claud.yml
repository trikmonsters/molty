name: 🎬 YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL (video / shorts / playlist)'
        required: true
        type: string
      format:
        description: 'Format unduhan'
        required: true
        default: 'video-best'
        type: choice
        options:
          - video-best
          - video-1080p
          - video-720p
          - video-480p
          - audio-mp3-320
          - audio-mp3-192
          - audio-m4a
      subtitle:
        description: 'Subtitle (id / en / kosong = tidak)'
        required: false
        default: ''
        type: string

jobs:
  download:
    name: 📥 Download
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip -qq
          pip install -q --upgrade yt-dlp
          echo "✅ yt-dlp: $(yt-dlp --version)"

      - name: 📁 Buat folder output
        run: mkdir -p ~/downloads

      # ── Setup & FIX cookies dari Secret ───────────────────
      - name: 🍪 Setup & fix cookies
        env:
          YT_SECURE_COOKIES: ${{ secrets.YT_SECURE_COOKIES }}
        run: |
          if [ -z "$YT_SECURE_COOKIES" ]; then
            echo "❌ Secret YT_SECURE_COOKIES tidak ditemukan!"
            exit 1
          fi

          printf '%s\n' "$YT_SECURE_COOKIES" > ~/cookies_raw.txt
          echo "📄 Raw cookies: $(wc -l < ~/cookies_raw.txt) baris"

          # Fix format: spasi antar kolom → tab (Netscape format butuh TAB)
          python3 - << 'PYEOF'
          import re, os
          
          src = os.path.expanduser("~/cookies_raw.txt")
          dst = os.path.expanduser("~/cookies.txt")
          out = []
          
          with open(src, encoding="utf-8", errors="replace") as f:
              for line in f:
                  line = line.rstrip("\r\n")
                  # Komentar & HttpOnly prefix
                  if line.startswith("#") or not line.strip():
                      out.append(line)
                      continue
                  # Hapus prefix #HttpOnly_ jika ada (beberapa exporter pakai ini)
                  if line.startswith("#HttpOnly_"):
                      line = line[len("#HttpOnly_"):]
                  # Split by tab dulu, kalau hasilnya 7 kolom sudah benar
                  parts = line.split("\t")
                  if len(parts) >= 7:
                      out.append("\t".join(parts))
                      continue
                  # Split by 2+ spasi sebagai fallback
                  parts = re.split(r'  +', line.strip())
                  parts = [p.strip() for p in parts if p.strip()]
                  if len(parts) >= 7:
                      out.append("\t".join(parts[:6] + [" ".join(parts[6:])]))
                  elif len(parts) > 0:
                      out.append("\t".join(parts))
          
          with open(dst, "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          
          yt_lines = [l for l in out if "youtube.com" in l and not l.startswith("#")]
          print(f"✅ Total baris: {len(out)}, cookie YouTube: {len(yt_lines)}")
          if yt_lines:
              # Tampilkan nama cookie saja (tanpa value)
              for l in yt_lines[:5]:
                  cols = l.split("\t")
                  print(f"  · {cols[0]} → {cols[5] if len(cols)>5 else '?'}")
          PYEOF

      # ── Download ──────────────────────────────────────────
      - name: 🎬 Download
        run: |
          URL="${{ inputs.url }}"
          FORMAT="${{ inputs.format }}"
          SUBTITLE="${{ inputs.subtitle }}"

          ARGS=(
            --no-warnings
            --progress
            --retries 10
            --fragment-retries 10
            --concurrent-fragments 4
            --no-part
            --merge-output-format mp4
            -o "$HOME/downloads/%(title)s [%(id)s].%(ext)s"
            --restrict-filenames
            --no-check-certificates
            --cookies ~/cookies.txt
            --extractor-args "youtube:player_client=tv_embedded,web_creator,ios"
          )

          if [ -n "$SUBTITLE" ]; then
            ARGS+=(--write-subs --write-auto-subs --sub-langs "$SUBTITLE" --embed-subs)
          fi

          case "$FORMAT" in
            video-best)    ARGS+=(-f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best") ;;
            video-1080p)   ARGS+=(-f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]") ;;
            video-720p)    ARGS+=(-f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]") ;;
            video-480p)    ARGS+=(-f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]") ;;
            audio-mp3-320) ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 0) ;;
            audio-mp3-192) ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 5) ;;
            audio-m4a)     ARGS+=(-f "bestaudio[ext=m4a]/bestaudio/best" -x --audio-format m4a) ;;
          esac

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 URL    : $URL"
          echo "📦 Format : $FORMAT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          yt-dlp "${ARGS[@]}" "$URL"

      - name: 📊 Info hasil
        if: always()
        run: |
          if ls ~/downloads/* 2>/dev/null; then
            echo "✅ Berhasil:"
            ls -lh ~/downloads/
          else
            echo "❌ Tidak ada file"
          fi

      - name: ☁️ Upload Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dl-${{ github.run_number }}"
          name: "📥 Download #${{ github.run_number }}"
          body: "**URL:** ${{ inputs.url }} | **Format:** ${{ inputs.format }}"
          files: ~/downloads/*
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 📤 Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "yt-dl-${{ github.run_number }}"
          path: ~/downloads/
          retention-days: 90
