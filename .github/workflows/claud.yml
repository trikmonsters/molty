name: 🎬 YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL (video / shorts / playlist)'
        required: true
        type: string
      format:
        description: 'Format unduhan'
        required: true
        default: 'video-best'
        type: choice
        options:
          - video-best
          - video-1080p
          - video-720p
          - video-480p
          - audio-mp3-320
          - audio-mp3-192
          - audio-m4a
      subtitle:
        description: 'Subtitle (id / en / kosong = tidak)'
        required: false
        default: ''
        type: string
      cookies_paste:
        description: |
          Paste isi cookies Netscape di sini (dari Cookie Editor → Export → Netscape).
          Dimulai dengan baris: # Netscape HTTP Cookie File
        required: false
        default: ''
        type: string

jobs:
  download:
    name: 📥 Download
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip -qq
          pip install -q --upgrade yt-dlp
          echo "✅ yt-dlp: $(yt-dlp --version)"

      - name: 📁 Buat folder output
        run: mkdir -p ~/downloads

      # ── Prioritas 1: dari input langsung (paste) ──────────
      - name: 🍪 Setup cookies dari input
        if: ${{ inputs.cookies_paste != '' }}
        run: |
          cat > ~/cookies.txt << 'COOKIESEOF'
          ${{ inputs.cookies_paste }}
          COOKIESEOF
          # Hapus indentasi spasi di awal tiap baris
          sed -i 's/^[[:space:]]*//' ~/cookies.txt
          echo "✅ Cookies dari input: $(wc -l < ~/cookies.txt) baris"
          head -2 ~/cookies.txt

      # ── Prioritas 2: dari GitHub Secret ───────────────────
      - name: 🍪 Setup cookies dari Secret (fallback)
        if: ${{ inputs.cookies_paste == '' }}
        env:
          YT_COOKIES: ${{ secrets.YT_SECURE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > ~/cookies.txt
            echo "✅ Cookies dari Secret: $(wc -l < ~/cookies.txt) baris"
            head -2 ~/cookies.txt
          else
            echo "⚠️  Tidak ada cookies — download kemungkinan gagal"
          fi

      # ── Validasi cookies ──────────────────────────────────
      - name: 🔍 Validasi cookies
        run: |
          if [ -f ~/cookies.txt ]; then
            echo "📄 Preview cookies.txt:"
            head -5 ~/cookies.txt
            echo "---"
            # Cek apakah ada cookie .youtube.com
            if grep -q "youtube.com" ~/cookies.txt; then
              echo "✅ Cookie YouTube ditemukan"
            else
              echo "⚠️  Tidak ada cookie youtube.com — pastikan export dari youtube.com"
            fi
            # Hapus baris kosong di awal jika ada
            sed -i '/^$/d' ~/cookies.txt
          else
            echo "❌ cookies.txt tidak ada"
          fi

      # ── Download ──────────────────────────────────────────
      - name: 🎬 Download
        run: |
          URL="${{ inputs.url }}"
          FORMAT="${{ inputs.format }}"
          SUBTITLE="${{ inputs.subtitle }}"

          ARGS=(
            --no-warnings
            --progress
            --retries 10
            --fragment-retries 10
            --concurrent-fragments 4
            --no-part
            --merge-output-format mp4
            -o "$HOME/downloads/%(title)s [%(id)s].%(ext)s"
            --restrict-filenames
            --no-check-certificates
            --extractor-args "youtube:player_client=tv_embedded,web_creator,ios"
          )

          if [ -f ~/cookies.txt ] && grep -q "youtube.com" ~/cookies.txt; then
            ARGS+=(--cookies ~/cookies.txt)
            echo "🍪 Menggunakan cookies"
          else
            echo "⚠️  Lanjut tanpa cookies"
          fi

          if [ -n "$SUBTITLE" ]; then
            ARGS+=(--write-subs --write-auto-subs --sub-langs "$SUBTITLE" --embed-subs)
          fi

          case "$FORMAT" in
            video-best)    ARGS+=(-f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best") ;;
            video-1080p)   ARGS+=(-f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]") ;;
            video-720p)    ARGS+=(-f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]") ;;
            video-480p)    ARGS+=(-f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]") ;;
            audio-mp3-320) ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 0) ;;
            audio-mp3-192) ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 5) ;;
            audio-m4a)     ARGS+=(-f "bestaudio[ext=m4a]/bestaudio/best" -x --audio-format m4a) ;;
          esac

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 URL    : $URL"
          echo "📦 Format : $FORMAT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          yt-dlp "${ARGS[@]}" "$URL"

      - name: 📊 Info hasil
        if: always()
        run: |
          if ls ~/downloads/* 2>/dev/null; then
            echo "✅ File berhasil diunduh:"
            ls -lh ~/downloads/
          else
            echo "❌ Tidak ada file"
          fi

      - name: ☁️ Upload Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dl-${{ github.run_number }}"
          name: "📥 Download #${{ github.run_number }}"
          body: "**URL:** ${{ inputs.url }} | **Format:** ${{ inputs.format }}"
          files: ~/downloads/*
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 📤 Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "yt-dl-${{ github.run_number }}"
          path: ~/downloads/
          retention-days: 90
