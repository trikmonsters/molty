name: 🎬 YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL (video atau playlist)'
        required: true
        type: string
      format:
        description: 'Format unduhan'
        required: true
        default: 'video-best'
        type: choice
        options:
          - video-best        # Video kualitas terbaik (mp4)
          - video-1080p       # Video 1080p (mp4)
          - video-720p        # Video 720p (mp4)
          - video-480p        # Video 480p (mp4)
          - audio-mp3-320     # Audio MP3 320kbps
          - audio-mp3-192     # Audio MP3 192kbps
          - audio-m4a         # Audio M4A (terbaik)
          - subtitle-only     # Subtitle saja
      subtitle:
        description: 'Unduh subtitle? (id=Indonesia, en=Inggris, kosong=tidak)'
        required: false
        default: ''
        type: string
      playlist_items:
        description: 'Item playlist (misal: 1-5, 1,3,5 — kosong = semua)'
        required: false
        default: ''
        type: string
      cookies:
        description: 'Cookie browser (untuk video private/age-restricted) — tempel isi file cookies.txt'
        required: false
        default: ''
        type: string

jobs:
  download:
    name: 📥 Download YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🔧 Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2 python3-pip -qq
          pip install -q --upgrade yt-dlp
          echo "✅ yt-dlp versi: $(yt-dlp --version)"
          echo "✅ ffmpeg versi: $(ffmpeg -version | head -1)"

      - name: 📁 Buat Folder Output
        run: mkdir -p ~/downloads

      - name: 🍪 Setup Cookies (jika ada)
        if: ${{ inputs.cookies != '' }}
        run: |
          echo "${{ inputs.cookies }}" > ~/cookies.txt
          echo "✅ Cookies berhasil disimpan"

      - name: 🎬 Download Video / Audio
        run: |
          URL="${{ inputs.url }}"
          FORMAT="${{ inputs.format }}"
          SUBTITLE="${{ inputs.subtitle }}"
          PLAYLIST="${{ inputs.playlist_items }}"

          # Base arguments
          ARGS=(
            --no-warnings
            --progress
            --console-title
            --retries 10
            --fragment-retries 10
            --retry-sleep 5
            --concurrent-fragments 4
            --buffer-size 16K
            --no-part
            --merge-output-format mp4
            -o "%(title)s [%(id)s].%(ext)s"
            --restrict-filenames
          )

          # Cookies
          if [ -f ~/cookies.txt ]; then
            ARGS+=(--cookies ~/cookies.txt)
          fi

          # Playlist items
          if [ -n "$PLAYLIST" ]; then
            ARGS+=(--playlist-items "$PLAYLIST")
          fi

          # Subtitle
          if [ -n "$SUBTITLE" ]; then
            ARGS+=(--write-subs --write-auto-subs --sub-langs "$SUBTITLE" --embed-subs)
          fi

          # Format selection
          case "$FORMAT" in
            video-best)
              ARGS+=(-f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best")
              ;;
            video-1080p)
              ARGS+=(-f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=1080]+bestaudio/best[height<=1080]")
              ;;
            video-720p)
              ARGS+=(-f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=720]+bestaudio/best[height<=720]")
              ;;
            video-480p)
              ARGS+=(-f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=480]+bestaudio/best[height<=480]")
              ;;
            audio-mp3-320)
              ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 0)
              ;;
            audio-mp3-192)
              ARGS+=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 5)
              ;;
            audio-m4a)
              ARGS+=(-f "bestaudio[ext=m4a]/bestaudio/best" -x --audio-format m4a)
              ;;
            subtitle-only)
              ARGS+=(--write-subs --write-auto-subs --skip-download --sub-langs all)
              ;;
          esac

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 URL     : $URL"
          echo "📦 Format  : $FORMAT"
          echo "🌐 Subtitle: ${SUBTITLE:-tidak}"
          echo "📋 Playlist: ${PLAYLIST:-semua}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          cd ~/downloads
          yt-dlp "${ARGS[@]}" "$URL"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📂 File hasil unduhan:"
          ls -lh ~/downloads/
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📊 Info Ukuran Total
        run: |
          echo "💾 Total ukuran:"
          du -sh ~/downloads/
          echo ""
          echo "📄 Daftar file:"
          find ~/downloads -type f | while read f; do
            size=$(stat -c%s "$f")
            name=$(basename "$f")
            echo "  • $name ($(numfmt --to=iec-i --suffix=B $size))"
          done

      - name: ☁️ Upload ke Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "download-${{ github.run_number }}"
          name: "📥 Download #${{ github.run_number }}"
          body: |
            **URL:** ${{ inputs.url }}
            **Format:** ${{ inputs.format }}
            **Subtitle:** ${{ inputs.subtitle || 'tidak' }}
            **Diunduh pada:** ${{ github.event.head_commit.timestamp || 'sekarang' }}
            
            > ⚠️ File akan otomatis terhapus setelah **90 hari** (batas GitHub Release)
          files: ~/downloads/*
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 📤 Upload sebagai Artifact (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: "youtube-download-${{ github.run_number }}"
          path: ~/downloads/
          retention-days: 90
          if-no-files-found: warn
