name: Download YouTube Shorts via VidsSave

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Shorts URL'
        required: true
        default: 'https://youtube.com/shorts/CIbeRYMGfbk'
      quality:
        description: 'Video quality (720p, 1080p, 360p, 240p)'
        required: true
        default: '720p'

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create Playwright script
        run: |
          cat > download.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');

          const YOUTUBE_URL = process.env.YOUTUBE_URL || 'https://youtube.com/shorts/CIbeRYMGfbk';
          const QUALITY = process.env.QUALITY || '720p';

          async function downloadFile(url, dest) {
            return new Promise((resolve, reject) => {
              const file = fs.createWriteStream(dest);
              const protocol = url.startsWith('https') ? https : http;

              const request = protocol.get(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Referer': 'https://vidssave.com/',
                }
              }, (response) => {
                if (response.statusCode === 301 || response.statusCode === 302) {
                  downloadFile(response.headers.location, dest).then(resolve).catch(reject);
                  return;
                }
                response.pipe(file);
                file.on('finish', () => {
                  file.close();
                  resolve();
                });
              });

              request.on('error', (err) => {
                fs.unlink(dest, () => {});
                reject(err);
              });
            });
          }

          (async () => {
            console.log(`🎬 Target URL: ${YOUTUBE_URL}`);
            console.log(`📺 Quality: ${QUALITY}`);

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              viewport: { width: 1280, height: 720 }
            });

            const page = await context.newPage();

            console.log('🌐 Navigating to vidssave.com...');
            await page.goto('https://vidssave.com/en/youtube-shorts-download', {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            // Screenshot awal
            await page.screenshot({ path: 'screenshot-1-initial.png' });
            console.log('📸 Screenshot 1: Initial page saved');

            // Cari input field dan isi URL
            console.log('🔍 Looking for input field...');
            const inputSelectors = [
              'input[type="text"]',
              'input[placeholder*="youtube"]',
              'input[placeholder*="URL"]',
              'input[placeholder*="url"]',
              'input[placeholder*="link"]',
              'input[name="url"]',
              'input[id*="url"]',
              '#url',
              '.input-url',
            ];

            let inputField = null;
            for (const selector of inputSelectors) {
              try {
                inputField = await page.waitForSelector(selector, { timeout: 5000 });
                if (inputField) {
                  console.log(`✅ Found input with selector: ${selector}`);
                  break;
                }
              } catch (e) {
                // try next selector
              }
            }

            if (!inputField) {
              // Fallback: cari semua input
              const allInputs = await page.$$('input');
              console.log(`Found ${allInputs.length} input(s) on page`);
              if (allInputs.length > 0) {
                inputField = allInputs[0];
              }
            }

            if (!inputField) {
              throw new Error('❌ Input field not found!');
            }

            // Clear dan isi input
            await inputField.click({ clickCount: 3 });
            await inputField.fill(YOUTUBE_URL);
            console.log(`✏️ Filled URL: ${YOUTUBE_URL}`);

            // Screenshot setelah isi input
            await page.screenshot({ path: 'screenshot-2-filled.png' });
            console.log('📸 Screenshot 2: After filling URL');

            // Tekan Enter atau klik tombol download
            console.log('⏎ Pressing Enter...');
            await inputField.press('Enter');

            // Tunggu hasil muncul
            console.log('⏳ Waiting for download options...');
            await page.waitForTimeout(5000);

            // Coba tunggu elemen hasil
            try {
              await page.waitForSelector('a[href*=".mp4"], a[download], .download-btn, button[data-url]', {
                timeout: 30000
              });
            } catch (e) {
              console.log('⚠️ Standard result selector not found, continuing...');
            }

            await page.screenshot({ path: 'screenshot-3-results.png' });
            console.log('📸 Screenshot 3: Results page saved');

            // Cari link download 720p
            console.log(`🔍 Looking for ${QUALITY} download link...`);

            // Coba berbagai cara untuk menemukan link download
            let downloadUrl = null;

            // Metode 1: Cari teks yang mengandung kualitas
            const links = await page.$$eval('a', (anchors, quality) => {
              return anchors
                .filter(a => {
                  const text = (a.textContent || '').toLowerCase();
                  const href = (a.href || '').toLowerCase();
                  const qualityLower = quality.toLowerCase();
                  return text.includes(qualityLower) || href.includes(qualityLower) ||
                         text.includes('download') || href.includes('.mp4');
                })
                .map(a => ({
                  text: a.textContent.trim(),
                  href: a.href,
                  download: a.getAttribute('download')
                }));
            }, QUALITY);

            console.log(`Found ${links.length} potential download links`);
            links.forEach((l, i) => console.log(`  Link ${i+1}: [${l.text}] -> ${l.href}`));

            // Cari yang paling cocok dengan kualitas yang diminta
            const qualityNum = QUALITY.replace('p', '');
            for (const link of links) {
              if (link.text.includes(QUALITY) || link.text.includes(qualityNum) ||
                  link.href.includes(qualityNum)) {
                downloadUrl = link.href;
                console.log(`✅ Found ${QUALITY} download URL: ${downloadUrl}`);
                break;
              }
            }

            // Jika tidak ketemu, coba klik tombol download 720p langsung
            if (!downloadUrl) {
              console.log(`⚠️ Direct link not found, trying to click ${QUALITY} button...`);

              const buttonSelectors = [
                `text=${QUALITY}`,
                `[data-quality="${QUALITY}"]`,
                `button:has-text("${QUALITY}")`,
                `a:has-text("${QUALITY}")`,
                `.download-${qualityNum}`,
              ];

              // Intercept download request
              let capturedUrl = null;
              await context.route('**/*.mp4**', async (route) => {
                capturedUrl = route.request().url();
                console.log(`🎯 Captured download URL: ${capturedUrl}`);
                await route.abort(); // Abort agar tidak download otomatis
              });

              for (const sel of buttonSelectors) {
                try {
                  const btn = await page.$(sel);
                  if (btn) {
                    console.log(`🖱️ Clicking: ${sel}`);
                    await btn.click();
                    await page.waitForTimeout(3000);
                    if (capturedUrl) {
                      downloadUrl = capturedUrl;
                      break;
                    }
                  }
                } catch(e) {
                  // try next
                }
              }
            }

            await page.screenshot({ path: 'screenshot-4-final.png' });
            console.log('📸 Screenshot 4: Final state saved');

            if (downloadUrl && downloadUrl.startsWith('http')) {
              console.log(`\n⬇️ Downloading video from: ${downloadUrl}`);
              const outputPath = `video-${QUALITY}.mp4`;
              await downloadFile(downloadUrl, outputPath);
              const stats = fs.statSync(outputPath);
              console.log(`✅ Download complete! File: ${outputPath} (${(stats.size / 1024 / 1024).toFixed(2)} MB)`);
            } else {
              console.log('❌ Could not find download URL. Check screenshots for debugging.');
              // Dump semua link di halaman
              const allLinks = await page.$$eval('a[href]', as => as.map(a => a.href));
              fs.writeFileSync('all-links.txt', allLinks.join('\n'));
              console.log(`Saved ${allLinks.length} links to all-links.txt`);
            }

            await browser.close();
            console.log('\n✨ Done!');
          })();
          EOF

      - name: Run Playwright download script
        env:
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: node download.js

      - name: Upload screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshot-*.png
          retention-days: 7

      - name: Upload downloaded video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video-${{ github.event.inputs.quality }}
          path: video-*.mp4
          retention-days: 7

      - name: Upload debug links (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-links
          path: all-links.txt
          if-no-files-found: ignore
          retention-days: 3
