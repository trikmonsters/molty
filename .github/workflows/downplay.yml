name: Download YouTube Shorts via VidsSave

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Shorts URL'
        required: true
        default: 'https://youtube.com/shorts/CIbeRYMGfbk'
      quality:
        description: 'Video quality (1080p, 720p, 360p, 240p)'
        required: true
        default: '720p'

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright axios

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Create Playwright script
        run: |
          cat > download.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const https = require('https');
          const http = require('http');

          const YOUTUBE_URL = process.env.YOUTUBE_URL || 'https://youtube.com/shorts/CIbeRYMGfbk';
          const QUALITY = (process.env.QUALITY || '720p').toUpperCase(); // e.g. "720P"

          function downloadFile(url, dest) {
            return new Promise((resolve, reject) => {
              const file = fs.createWriteStream(dest);
              const proto = url.startsWith('https') ? https : http;
              function doGet(targetUrl) {
                proto.get(targetUrl, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                    'Referer': 'https://vidssave.com/'
                  }
                }, (res) => {
                  if (res.statusCode === 301 || res.statusCode === 302) {
                    return doGet(res.headers.location);
                  }
                  res.pipe(file);
                  file.on('finish', () => { file.close(); resolve(); });
                }).on('error', (e) => { fs.unlink(dest, () => {}); reject(e); });
              }
              doGet(url);
            });
          }

          (async () => {
            console.log(`🎬 YouTube URL : ${YOUTUBE_URL}`);
            console.log(`📺 Quality     : ${QUALITY}`);

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
              viewport: { width: 1280, height: 900 }
            });

            const page = await context.newPage();

            // ── 1. Buka halaman ──────────────────────────────────────────
            console.log('\n[1/5] Opening vidssave.com...');
            await page.goto('https://vidssave.com/en/youtube-shorts-download', {
              waitUntil: 'networkidle',
              timeout: 60000
            });
            await page.screenshot({ path: 'ss1-open.png' });

            // ── 2. Isi input (id="url-input-wrapper") ────────────────────
            console.log('[2/5] Filling input #url-input-wrapper...');
            await page.waitForSelector('#url-input-wrapper', { timeout: 20000 });
            await page.click('#url-input-wrapper');
            await page.fill('#url-input-wrapper', YOUTUBE_URL);
            await page.screenshot({ path: 'ss2-filled.png' });
            console.log('      URL filled ✓');

            // ── 3. Enter → tunggu hasil ──────────────────────────────────
            console.log('[3/5] Pressing Enter and waiting for results...');
            await page.press('#url-input-wrapper', 'Enter');

            // Tunggu list item hasil muncul (li yang berisi MP4 + kualitas)
            await page.waitForSelector('li .text-left', { timeout: 60000 });
            await page.waitForTimeout(2000); // beri waktu semua item render
            await page.screenshot({ path: 'ss3-results.png' });
            console.log('      Results loaded ✓');

            // ── 4. Temukan baris kualitas yang diminta ───────────────────
            console.log(`[4/5] Looking for ${QUALITY} row...`);

            // Setiap baris = <li> yang mengandung div teks kualitas (misal "720P")
            // Struktur: li > div > div[MP4] + div[720P] + div[size] ... + div[Download btn]
            const downloadUrl = await page.evaluate((targetQuality) => {
              const items = document.querySelectorAll('li');
              for (const li of items) {
                // Cek apakah li ini mengandung teks kualitas yang diminta
                const divs = li.querySelectorAll('div');
                let qualityMatch = false;
                for (const d of divs) {
                  if (d.textContent.trim() === targetQuality) {
                    qualityMatch = true;
                    break;
                  }
                }
                if (!qualityMatch) continue;

                // Temukan tombol download di dalam li ini
                // Tombol = div yang punya cursor-pointer dan span teks "Download"
                const btn = li.querySelector('div[class*="cursor-pointer"]');
                if (btn) {
                  // Cari data url — bisa di atribut data-url, onclick, atau href di dalam
                  const anchor = li.querySelector('a[href]');
                  if (anchor) return anchor.href;

                  // Kalau tidak ada anchor, cari atribut lain
                  const allEls = li.querySelectorAll('[data-url],[data-href],[data-link]');
                  for (const el of allEls) {
                    const u = el.dataset.url || el.dataset.href || el.dataset.link;
                    if (u && u.includes('http')) return u;
                  }
                }
              }
              return null;
            }, QUALITY);

            if (downloadUrl) {
              console.log(`      Found direct URL: ${downloadUrl}`);
            } else {
              // Fallback: klik tombol Download pada baris yang sesuai lalu intercept request
              console.log(`      Direct URL not found, clicking Download button for ${QUALITY}...`);

              let capturedUrl = null;

              // Intercept semua request video/mp4
              await page.route('**', async (route) => {
                const req = route.request();
                const url = req.url();
                if (
                  url.includes('.mp4') ||
                  url.includes('video') ||
                  req.resourceType() === 'media'
                ) {
                  capturedUrl = url;
                  console.log(`      🎯 Intercepted: ${url}`);
                  await route.abort();
                } else {
                  await route.continue();
                }
              });

              // Klik tombol Download pada baris kualitas yang tepat
              await page.evaluate((targetQuality) => {
                const items = document.querySelectorAll('li');
                for (const li of items) {
                  const divs = li.querySelectorAll('div');
                  let qualityMatch = false;
                  for (const d of divs) {
                    if (d.textContent.trim() === targetQuality) {
                      qualityMatch = true;
                      break;
                    }
                  }
                  if (!qualityMatch) continue;
                  const btn = li.querySelector('div[class*="cursor-pointer"]');
                  if (btn) { btn.click(); return; }
                }
              }, QUALITY);

              await page.waitForTimeout(5000);
              await page.screenshot({ path: 'ss4-after-click.png' });

              if (capturedUrl) {
                console.log(`      Captured URL: ${capturedUrl}`);
              } else {
                // Last resort: dump semua href & src di halaman
                const allLinks = await page.evaluate(() => {
                  return [...document.querySelectorAll('a[href],source[src],[data-url]')]
                    .map(el => el.href || el.src || el.dataset.url)
                    .filter(u => u && u.startsWith('http'));
                });
                fs.writeFileSync('debug-links.txt', allLinks.join('\n'));
                console.log(`❌ Could not capture download URL. Saved ${allLinks.length} links to debug-links.txt`);
                await browser.close();
                process.exit(1);
              }

              // Gunakan capturedUrl untuk download
              console.log(`\n[5/5] Downloading ${QUALITY} video...`);
              const outFile = `video-${QUALITY}.mp4`;
              await downloadFile(capturedUrl, outFile);
              const size = (fs.statSync(outFile).size / 1024 / 1024).toFixed(2);
              console.log(`✅ Saved: ${outFile} (${size} MB)`);
              await browser.close();
              return;
            }

            // ── 5. Download file ─────────────────────────────────────────
            console.log(`\n[5/5] Downloading ${QUALITY} video...`);
            const outFile = `video-${QUALITY}.mp4`;
            await downloadFile(downloadUrl, outFile);
            const size = (fs.statSync(outFile).size / 1024 / 1024).toFixed(2);
            console.log(`✅ Saved: ${outFile} (${size} MB)`);

            await browser.close();
            console.log('\n🎉 All done!');
          })();
          EOF

      - name: Run script
        env:
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: node download.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ss*.png
          retention-days: 7

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.quality }}
          path: video-*.mp4
          retention-days: 7

      - name: Upload debug links (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-links
          path: debug-links.txt
          if-no-files-found: ignore
          retention-days: 3
