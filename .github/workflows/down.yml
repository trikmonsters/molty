name: Download YouTube Short to Release (Final Fix)

on:
  workflow_dispatch:

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. Ambil kode dari repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Python dan FFmpeg
    - name: Set up Python & FFmpeg
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. Setup Node.js (Wajib sebagai basic JS runtime)
    - name: Set up Node.js (JS Runtime)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 4. Install & Update yt-dlp ke versi mutakhir
    - name: Install yt-dlp
      run: |
        sudo pip install --upgrade yt-dlp

    # 5. Generate file cookie dari GitHub Secret Anda
    - name: Generate Temporary Cookie File
      run: |
        echo "${{ secrets.YT_SECURE_COOKIES }}" > secret_cookies.txt

    # 6. Jalankan download dengan mematikan pengecekan webpage web normal
    # Kita paksa yt-dlp hanya meminta data dari API Android murni (Bypass N-Challenge Web)
    - name: Download Video Using Android Client API
      run: |
        yt-dlp -f "bv+ba/b" \
          --merge-output-format mp4 \
          --extractor-args "youtube:player-client=android;skip=webpage" \
          --cookies secret_cookies.txt \
          "https://youtube.com/shorts/XYa54DRkC9Q" \
          -o "Kasur_Paling_Nyaman.mp4"

    # 7. Bersihkan file cookie setelah selesai
    - name: Clean up Cookie File
      if: always()
      run: rm -f secret_cookies.txt

    # 8. Upload hasil download .mp4 ke GitHub Release
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Download Hasil #${{ github.run_number }}"
        body: "Berhasil mengunduh YouTube Shorts setelah melewati proteksi bot dan perbaikan n-challenge via Android API Client."
        files: Kasur_Paling_Nyaman.mp4
