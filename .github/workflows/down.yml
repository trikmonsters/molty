name: Download YouTube Short to Release (Secure Cookie)

on:
  workflow_dispatch: # Jalankan manual lewat tombol di GitHub

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin untuk membuat Release aset

    steps:
    # 1. Ambil kode dari repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Python dan FFmpeg untuk menyatukan Audio & Video
    - name: Set up Python & FFmpeg
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. Setup Node.js sebagai JavaScript Runtime untuk yt-dlp
    - name: Set up Node.js (JS Runtime)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 4. Install/Update yt-dlp versi terbaru
    - name: Install yt-dlp
      run: |
        sudo pip install --upgrade yt-dlp

    # 5. Generate file cookie dari GitHub Secret secara aman sebelum download
    - name: Generate Temporary Cookie File
      run: |
        echo "${{ secrets.YT_SECURE_COOKIES }}" > secret_cookies.txt

    # 6. Download Video menggunakan otentikasi Cookie Akun Cadangan
    - name: Download Video Using Bot Bypass
      run: |
        yt-dlp -f "bestvideo+bestaudio/best" \
          --merge-output-format mp4 \
          --cookies secret_cookies.txt \
          "https://youtube.com/shorts/XYa54DRkC9Q" \
          -o "Kasur_Paling_Nyaman.mp4"

    # 7. Hapus file cookie dari server demi keamanan privasi berkala
    - name: Clean up Cookie File
      if: always() # Langkah ini akan tetap berjalan meskipun proses download gagal/sukses
      run: rm -f secret_cookies.txt

    # 8. Upload hasil download .mp4 ke GitHub Release
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Download Hasil #${{ github.run_number }}"
        body: "Berhasil mengunduh YouTube Shorts dengan resolusi terbaik via Otentikasi Akun Cadangan."
        files: Kasur_Paling_Nyaman.mp4
