name: Download YouTube Short (Fully Automated)

on:
  workflow_dispatch: # Tinggal klik tombol Run, langsung jalan otomatis

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. Ambil kode repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Python & FFmpeg (Wajib untuk merge video + audio)
    - name: Set up Python & FFmpeg
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. Install/Update yt-dlp versi paling baru (paling krusial)
    - name: Install yt-dlp
      run: |
        sudo pip install --upgrade yt-dlp

    # 4. Download otomatis menggunakan Web API Klien Alternatif
    # Trik utama: Menggunakan klien 'tv' atau 'android' yang tidak seketat web biasa
    - name: Download Video Automatically
      run: |
        yt-dlp -f "bestvideo+bestaudio/best" \
          --merge-output-format mp4 \
          --extractor-args "youtube:player-client=tv,html5" \
          --no-warnings \
          "https://youtube.com/shorts/XYa54DRkC9Q" \
          -o "Kasur_Paling_Nyaman.mp4"

    # 5. Simpan langsung ke GitHub Release
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Auto Download #${{ github.run_number }}"
        body: "Unduhan otomatis YouTube Shorts berhasil tanpa menggunakan cookie manual."
        files: Kasur_Paling_Nyaman.mp4
