name: Download YouTube Short to Release

on:
  workflow_dispatch: # Tombol jalankan manual di GitHub Actions

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar Actions punya izin membuat Release

    steps:
    # 1. Checkout repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python & FFmpeg (untuk menggabungkan audio + video)
    - name: Set up Python & FFmpeg
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. UPDATE: Menggunakan yt-dlp menggantikan youtube-dl yang usang
    - name: Install yt-dlp
      run: |
        sudo pip install --upgrade yt-dlp

    # 4. Download Video menggunakan yt-dlp (Perintah tetap sama persis)
    - name: Download Video
      run: |
        yt-dlp -f "bestvideo+bestaudio/best" --merge-output-format mp4 "https://youtube.com/shorts/XYa54DRkC9Q" -o "Kasur_Paling_Nyaman.mp4"

    # 5. Upload hasil download langsung ke GitHub Release
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Download Hasil #${{ github.run_number }}"
        body: "Berhasil mengunduh YouTube Shorts dengan resolusi terbaik dan audio utuh."
        files: Kasur_Paling_Nyaman.mp4
