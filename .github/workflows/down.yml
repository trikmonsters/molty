name: Download YouTube Short to Release (Bypass System)

on:
  workflow_dispatch:

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. Ambil kode dari repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Python dan FFmpeg
    - name: Set up Python & FFmpeg
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. Install/Update yt-dlp ke versi terbaru
    - name: Install yt-dlp
      run: |
        sudo pip install --upgrade yt-dlp

    # 4. Ambil video via direct stream proxy (Bypass n-challenge & Cookies)
    - name: Download Video Automatically
      run: |
        yt-dlp -f "best" \
          --no-check-certificates \
          "https://inv.tux.digital/latest_version?id=XYa54DRkC9Q&itag=22" \
          -o "Kasur_Paling_Nyaman.mp4"

    # 5. Upload hasil download .mp4 ke GitHub Release
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Download Hasil #${{ github.run_number }}"
        body: "Berhasil mengunduh video dengan bypass enkripsi n-challenge YouTube via Invidious Stream."
        files: Kasur_Paling_Nyaman.mp4
