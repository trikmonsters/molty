name: TTS Lokal dengan MeloTTS (Fixed)
on: [workflow_dispatch]

jobs:
  melo-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for MeCab
        run: |
          sudo apt-get update
          sudo apt-get install -y mecab libmecab-dev mecab-ipadic-utf8

      - name: Install Python Dependencies
        run: |
          # PyTorch CPU-only (hemat bandwidth)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # MeCab Python bindings + lightweight dictionary
          pip install mecab-python3 unidic-lite
          
          # MeloTTS dari GitHub
          pip install git+https://github.com/myshell-ai/MeloTTS.git

      - name: Cache Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/melo
          key: melo-tts-id-${{ hashFiles('**/requirements.txt') }}
          restore-keys: melo-tts-id-

      - name: Generate Speech
        run: |
          python -c "
          from melo.api import TTS
          import os, sys
          
          print('⏳ Loading model Indonesia...')
          model = TTS(language='ID', device='cpu')
          
          text = 'Halo! Ini contoh text-to-speech dengan suara lokal Indonesia yang lebih natural.'
          output = 'output.wav'
          
          model.tts_to_file(text, output, speaker_id=0, speed=1.0)
          
          size = os.path.getsize(output) / 1024
          print(f'✅ Success: {output} ({size:.1f} KB)')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melo-tts-output
          path: output.wav
