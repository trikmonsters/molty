name: TTS Lokal → GitHub Release
on:
  workflow_dispatch:
    inputs:
      custom_text:
        description: 'Teks untuk TTS (kosong = pakai default)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'tts-input.txt'  # Trigger jika file teks diubah

jobs:
  generate-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # Diperlukan untuk upload ke Release
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Piper TTS
        run: pip install piper-tts

      - name: Cache Indonesian Model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/piper
          key: piper-id-upik-low-v1
          restore-keys: piper-id-

      - name: Download Model (jika belum ada di cache)
        run: |
          mkdir -p ~/.local/share/piper
          if [ ! -f ~/.local/share/piper/id_ID-upik-low.onnx ]; then
            echo "⏳ Downloading Piper Indonesian model..."
            wget -q https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/id_ID/upik/low/id_ID-upik-low.onnx \
              -O ~/.local/share/piper/id_ID-upik-low.onnx
            wget -q https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/id_ID/upik/low/id_ID-upik-low.onnx.json \
              -O ~/.local/share/piper/id_ID-upik-low.onnx.json
            echo "✅ Model downloaded"
          fi

      - name: Prepare Text Input
        id: text-input
        run: |
          if [ -n "${{ github.event.inputs.custom_text }}" ]; then
            echo "📝 Using custom input from workflow_dispatch"
            echo "${{ github.event.inputs.custom_text }}" > input.txt
          elif [ -f tts-input.txt ]; then
            echo "📝 Using text from tts-input.txt file"
            cp tts-input.txt input.txt
          else
            echo "📝 Using default Gelmerbahn text"
            cat > input.txt << 'DEFAULT_TEXT'
Jangan pernah coba-coba naik kereta ini kalau kamu punya riwayat penyakit jantung. Bukan di taman bermain, tapi ini adalah jalur transportasi nyata di pegunungan Swiss yang punya kemiringan hampir tegak lurus. Sekali lepas kendali, taruhannya nyawa. Nama tempatnya Gelmerbahn. Coba cek share ketiga kamu, berani gak dia kamu ajak ke sini?
DEFAULT_TEXT
          fi
          # Generate filename based on text hash (untuk menghindari overwrite)
          HASH=$(echo -n "$(cat input.txt)" | md5sum | cut -c1-8)
          echo "filename=gelmerbahn-${HASH}.wav" >> $GITHUB_OUTPUT
          echo "📄 Text preview: $(head -c 100 input.txt)..."

      - name: Generate Speech with Piper
        run: |
          cat input.txt | piper \
            --model ~/.local/share/piper/id_ID-upik-low.onnx \
            --output_file ${{ steps.text-input.outputs.filename }} \
            --speaker 0 \
            --length_scale 0.95  # Sedikit lebih lambat agar lebih natural
          
          echo "✅ Audio generated: ${{ steps.text-input.outputs.filename }}"
          ls -lh ${{ steps.text-input.outputs.filename }}

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-release-${{ github.run_number }}
          name: "🔊 TTS Output #${{ github.run_number }}"
          body: |
            ### 🎧 Audio TTS - Gelmerbahn Story
            - **Generated at**: ${{ github.event.head_commit.timestamp }}
            - **Engine**: Piper TTS (id_ID-upik-low)
            - **Text length**: $(wc -c < input.txt) characters
            - **File size**: $(ls -lh ${{ steps.text-input.outputs.filename }} | awk '{print $5}')
            
            <details>
            <summary>📝 Preview Teks</summary>
            
            ```
            $(cat input.txt)
            ```
            </details>
          files: |
            ${{ steps.text-input.outputs.filename }}
            input.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Download Link
        run: |
          echo "✅ SUCCESS! Download your .wav file directly:"
          echo "🔗 https://github.com/${{ github.repository }}/releases/latest/download/${{ steps.text-input.outputs.filename }}"
