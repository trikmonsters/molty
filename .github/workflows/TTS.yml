name: 🎙️ MMS-TTS Indonesian

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Teks untuk TTS (kosongkan untuk pakai default)"
        required: false
        default: "Jangan pernah coba-coba naik kereta ini kalau kamu punya riwayat penyakit jantung. Bukan di taman bermain, tapi ini adalah jalur transportasi nyata di pegunungan Swiss yang punya kemiringan hampir tegak lurus. Sekali lepas kendali, taruhannya nyawa. Nama tempatnya Gelmerbahn. Coba cek share ketiga kamu, berani gak dia kamu ajak ke sini?"

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # cache: pip dihapus karena tidak ada requirements.txt/pyproject.toml

      - name: 📦 Install Dependencies
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu --no-cache-dir
          pip install transformers accelerate scipy soundfile --no-cache-dir

      - name: 💾 Cache MMS Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: mms-tts-ind-${{ runner.os }}
          restore-keys: mms-tts-ind-

      - name: 🔊 Generate TTS Audio
        env:
          TTS_TEXT: ${{ inputs.text }}
        run: |
          python - << 'PY'
          import os, hashlib, scipy, torch
          from transformers import VitsModel, AutoTokenizer

          text = os.environ["TTS_TEXT"].strip()
          if not text:
              raise ValueError("Teks kosong. Harap isi pada form workflow_dispatch.")

          print("📥 Memuat model MMS-TTS Indonesia...")
          model = VitsModel.from_pretrained("facebook/mms-tts-ind")
          tokenizer = AutoTokenizer.from_pretrained("facebook/mms-tts-ind")

          print("🎙️ Mengonversi teks ke audio...")
          inputs = tokenizer(text, return_tensors="pt")
          with torch.no_grad():
              audio = model(**inputs).waveform

          file_hash = hashlib.md5(text.encode()).hexdigest()[:6]
          filename = f"audio_{file_hash}.wav"
          scipy.io.wavfile.write(filename, model.config.sampling_rate, audio.numpy().squeeze())
          print(f"✅ Audio tersimpan: {filename}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"OUTPUT_FILE={filename}\n")
          PY

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-${{ github.run_number }}
          name: "🎧 Audio TTS #${{ github.run_number }}"
          body: |
            ### 📝 Teks yang Digunakan
            ```text
            ${{ inputs.text }}
            ```
            > 💡 Klik file `.wav` di atas untuk download langsung (tidak perlu ekstrak ZIP).
          files: ${{ env.OUTPUT_FILE }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
