- name: Generate Speech (Auto-download)
  run: |
    python -c "
    from piper import PiperVoice
    import asyncio
    
    async def main():
        voice = await PiperVoice.load(
            model='id_ID-upik-low',
            data_dir=None,  # Auto-download ke ~/.local/share/piper
            use_cuda=False
        )
        with open('output.wav', 'wb') as f:
            await voice.synthesize('Halo! Ini contoh TTS dengan Piper.', f)
    
    asyncio.run(main())
    "
