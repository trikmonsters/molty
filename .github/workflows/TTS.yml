name: 🎙️ Edge-TTS Indonesian

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Teks untuk TTS (kosongkan untuk pakai default)"
        required: false
        default: "Jangan pernah coba-coba naik kereta ini kalau kamu punya riwayat penyakit jantung. Bukan di taman bermain, tapi ini adalah jalur transportasi nyata di pegunungan Swiss yang punya kemiringan hampir tegak lurus. Sekali lepas kendali, taruhannya nyawa. Nama tempatnya Gelmerbahn. Coba cek share ketiga kamu, berani gak dia kamu ajak ke sini?"

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          pip install edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🔊 Generate TTS Audio
        env:
          TTS_TEXT: ${{ inputs.text }}
        run: |
          if [ -z "$TTS_TEXT" ]; then
            echo "❌ Error: Teks kosong."
            exit 1
          fi

          VOICE="id-ID-ArdiNeural"
          FILE_HASH=$(echo -n "$TTS_TEXT" | md5sum | cut -c1-6)
          MP3_FILE="audio_${FILE_HASH}.mp3"
          WAV_FILE="audio_${FILE_HASH}.wav"

          # Simpan teks ke file agar aman dari karakter khusus
          echo "$TTS_TEXT" > /tmp/tts_input.txt

          echo "🎙️ Mengonversi teks ke audio (Voice: $VOICE)..."
          edge-tts --file /tmp/tts_input.txt --voice "$VOICE" --write-media "$MP3_FILE"

          echo "🔄 Konversi native MP3 ke format .wav..."
          ffmpeg -y -i "$MP3_FILE" -acodec pcm_s16le -ar 44100 "$WAV_FILE"

          echo "✅ Audio berhasil: $WAV_FILE"
          echo "OUTPUT_FILE=$WAV_FILE" >> $GITHUB_ENV

      - name: 🚀 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-edge-${{ github.run_number }}
          name: "🎧 Edge-TTS Audio #${{ github.run_number }}"
          body: |
            ### 📝 Teks yang Digunakan
            ```text
            ${{ inputs.text }}
            ```
            > 💡 Klik file `.wav` di atas untuk download langsung (tidak perlu ekstrak ZIP).
            > 🎙️ Voice: `id-ID-GadisNeural` (Microsoft Neural)
          files: ${{ env.OUTPUT_FILE }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
