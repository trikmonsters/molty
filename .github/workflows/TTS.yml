name: TTS Lokal dengan MMS-TTS Indonesian
on: [workflow_dispatch]

jobs:
  mms-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch CPU-only (dari index khusus)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu --no-cache-dir

      - name: Install Other Dependencies (dari PyPI default)
        run: |
          pip install transformers accelerate scipy soundfile --no-cache-dir

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: mms-tts-ind-${{ hashFiles('**/requirements.txt') }}
          restore-keys: mms-tts-ind-

      - name: Generate Speech
        run: |
          python - << 'EOF'
          from transformers import VitsModel, AutoTokenizer
          import torch, scipy, os, sys
          
          print("⏳ Loading MMS-TTS Indonesian model...")
          model_id = "facebook/mms-tts-ind"
          model = VitsModel.from_pretrained(model_id)
          tokenizer = AutoTokenizer.from_pretrained(model_id)
          
          text = "Halo! Ini contoh text-to-speech dengan suara lokal Indonesia yang lebih natural."
          inputs = tokenizer(text, return_tensors="pt")
          
          print("🔊 Generating audio...")
          with torch.no_grad():
              output = model(**inputs).waveform
          
          output_path = "output.wav"
          sampling_rate = model.config.sampling_rate
          scipy.io.wavfile.write(output_path, rate=sampling_rate, data=output.numpy().squeeze())
          
          size_kb = os.path.getsize(output_path) / 1024
          print(f"✅ Success: {output_path} ({size_kb:.1f} KB, {sampling_rate}Hz)")
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mms-tts-indonesian-audio
          path: output.wav
