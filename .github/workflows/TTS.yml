# .github/workflows/tts-piper.yml
name: Generate TTS dengan Piper (Indonesia)
on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Teks yang ingin diubah ke suara'
        required: true
        default: 'Halo! Ini contoh text-to-speech gratis di GitHub Actions dengan Piper.'
      voice:
        description: 'Voice ID (id_ID-upik-low / id_ID-upik-medium)'
        required: false
        default: 'id_ID-upik-low'

jobs:
  piper-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Piper
        run: pip install piper-tts

      - name: Cache Model & Binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/piper
            ~/.cache/piper
          key: piper-${{ github.event.inputs.voice || 'id_ID-upik-low' }}-v1
          restore-keys: piper-

      - name: Download Model (jika belum ada di cache)
        run: |
          VOICE="${{ github.event.inputs.voice || 'id_ID-upik-low' }}"
          mkdir -p ~/.local/share/piper
          
          if [ ! -f ~/.local/share/piper/${VOICE}.onnx ]; then
            echo "⏳ Downloading model: $VOICE"
            BASE_URL="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0"
            PATH_PART="${VOICE//_//}"  # id_ID-upik-low → id/ID/upik/low
            PATH_PART="${PATH_PART//id_ID/id/ID}"
            
            wget -q "${BASE_URL}/${PATH_PART}/${VOICE}.onnx" \
              -O ~/.local/share/piper/${VOICE}.onnx
            wget -q "${BASE_URL}/${PATH_PART}/${VOICE}.onnx.json" \
              -O ~/.local/share/piper/${VOICE}.onnx.json
            echo "✅ Model downloaded"
          else
            echo "✅ Model already cached"
          fi

      - name: Generate Speech
        run: |
          TEXT="${{ github.event.inputs.text }}"
          VOICE="${{ github.event.inputs.voice || 'id_ID-upik-low' }}"
          MODEL_PATH="$HOME/.local/share/piper/${VOICE}.onnx"
          
          echo "🎙️ Generating: $TEXT"
          echo "$TEXT" | piper \
            --model "$MODEL_PATH" \
            --output_file output.wav \
            --speaker 0 \
            --length_scale 1.0 \
            --noise_scale 0.667 \
            --noise_w 0.8
          
          echo "✅ Audio generated: output.wav"

      - name: Convert to MP3 (Opsional - lebih kecil)
        run: |
          if command -v ffmpeg &> /dev/null; then
            ffmpeg -y -i output.wav -codec:a libmp3lame -qscale:a 2 output.mp3
            echo "✅ Converted to MP3"
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
            ffmpeg -y -i output.wav -codec:a libmp3lame -qscale:a 2 output.mp3
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-output-${{ github.run_number }}
          path: output.*
          retention-days: 7
