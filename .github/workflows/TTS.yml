name: TTS Lokal dengan MeloTTS
on: [workflow_dispatch]

jobs:
  melo-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Batas aman untuk cold start + generate
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          # 1. PyTorch CPU-only (hindari download CUDA ~2GB)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # 2. MeloTTS dari GitHub (tidak ada di PyPI)
          pip install git+https://github.com/myshell-ai/MeloTTS.git

      - name: Cache Model & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/melo
            ~/.cache/torch
          key: melo-tts-id-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            melo-tts-id-cache-

      - name: Generate Speech
        run: |
          python - << 'PYTHON_SCRIPT'
          from melo.api import TTS
          import os

          print("⏳ Memuat model Indonesia... (hanya lambat di run pertama)")
          model = TTS(language='ID', device='cpu')
          
          text = "Halo! Ini contoh text-to-speech dengan suara lokal Indonesia yang lebih natural dan tidak kaku."
          output_file = "output.wav"
          
          model.tts_to_file(text, output_file, speaker_id=0, speed=1.0)
          
          size_kb = os.path.getsize(output_file) / 1024
          print(f"✅ Audio berhasil: {output_file} ({size_kb:.1f} KB)")
          PYTHON_SCRIPT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melo-tts-indonesian
          path: output.wav
