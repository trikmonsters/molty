name: TTS Lokal dengan MMS-TTS Indonesian
on: [workflow_dispatch]

jobs:
  mms-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade transformers accelerate scipy torch torchaudio \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Cache Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: mms-tts-ind-cache
          restore-keys: mms-tts-

      - name: Generate Speech
        run: |
          python - << 'EOF'
          from transformers import VitsModel, AutoTokenizer
          import torch, scipy, os
          
          print("⏳ Loading MMS-TTS Indonesian model...")
          model = VitsModel.from_pretrained("facebook/mms-tts-ind")
          tokenizer = AutoTokenizer.from_pretrained("facebook/mms-tts-ind")
          
          text = "Halo! Ini contoh text-to-speech dengan suara lokal Indonesia yang lebih natural dan tidak kaku."
          inputs = tokenizer(text, return_tensors="pt")
          
          with torch.no_grad():
              output = model(**inputs).waveform
          
          output_path = "output.wav"
          scipy.io.wavfile.write(output_path, rate=model.config.sampling_rate, data=output.numpy().squeeze())
          
          size_kb = os.path.getsize(output_path) / 1024
          print(f"✅ Audio berhasil: {output_path} ({size_kb:.1f} KB)")
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mms-tts-indonesian
          path: output.wav
