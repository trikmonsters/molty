name: F5 TTS Indonesia

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install ffmpeg -y

      - name: Install Torch CPU
        run: |
          pip install torch torchaudio

      - name: Install F5-TTS
        run: |
          pip install f5-tts

      - name: Run TTS
        run: |
          python main.py

      - name: Upload Audio
        uses: actions/upload-artifact@v4
        with:
          name: hasil-suara
          path: output/*
