name: Kokoro TTS

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install kokoro onnxruntime soundfile

      - name: Run TTS
        run: python main.py

      - name: Upload Audio
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio
          path: "*.wav"
